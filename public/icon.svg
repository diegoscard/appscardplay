<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172e" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="tvBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- TV Outer Screen Frame -->
  <rect x="56" y="86" width="400" height="280" rx="36" fill="#0f172a" stroke="url(#tvBorder)" stroke-width="8" filter="url(#glow)" />
  <rect x="56" y="86" width="400" height="280" rx="36" fill="#0a0f1e" stroke="url(#tvBorder)" stroke-width="6" />

  <!-- TV Stand Base -->
  <path d="M226 366 L206 420 L306 420 L286 366 Z" fill="#1e293b" />
  <rect x="176" y="420" width="160" height="14" rx="7" fill="url(#accent)" />

  <!-- Screen Content: Play Triangle & SP Letters -->
  <circle cx="256" cy="226" r="76" fill="#1e293b" stroke="#00f2fe" stroke-width="4" />
  <polygon points="240,186 294,226 240,266" fill="url(#accent)" />

  <!-- Signal Live Waves Top -->
  <circle cx="256" cy="56" r="8" fill="#00f2fe" />
  <path d="M226 50 Q256 36 286 50" fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" />
  <path d="M206 38 Q256 20 306 38" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.7" />

  <!-- Smart TV Badge -->
  <rect x="196" y="448" width="120" height="26" rx="13" fill="#0369a1" />
  <text x="256" y="465" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">SMART TV</text>
</svg>
